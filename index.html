const Ctx = createContext(null);
const useApp = ()=>useContext(Ctx);

/* ============================================================
   IMG con fallback a catena
   ============================================================ */
function Img({src,fallbacks=[],alt="",ratio="16 / 10",contain=true}){
  const list = useMemo(()=>[src,...fallbacks].filter(Boolean),[src,fallbacks]);
  const [i,setI] = useState(0);
  useEffect(()=>setI(0),[src]);
  return (
    <div className="relative overflow-hidden rounded-xl" style={{aspectRatio:ratio,background:"#07080f",border:"1px solid var(--line)"}}>
      <img
        src={list[Math.min(i,list.length-1)]}
        alt={alt}
        loading="lazy"
        decoding="async"
        onError={()=>{ if(i < list.length-1) setI(i+1); }}
        className={"absolute inset-0 h-full w-full " + (contain?"object-contain":"object-cover")}
      />
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [lang,setLang] = useState(()=>localStorage.getItem("ge-lang") || "it");
  const [route,setRoute] = useState(()=> (window.location.hash.replace(/^#/,"")||"/boot"));
  const [session,setSession] = useState(()=> sessionStorage.getItem("ge-in")==="1");
  const [cart,setCart] = useState([]);
  const [cartOpen,setCartOpen] = useState(false);
  const [menuOpen,setMenuOpen] = useState(false);

  useEffect(()=>{ localStorage.setItem("ge-lang",lang); document.documentElement.lang=lang; },[lang]);

  useEffect(()=>{
    const onHash = ()=>{
      const r = window.location.hash.replace(/^#/,"")||"/boot";
      setRoute(r);
      window.scrollTo({top:0,behavior:"auto"});
      setMenuOpen(false);
    };
    window.addEventListener("hashchange",onHash);
    return ()=>window.removeEventListener("hashchange",onHash);
  },[]);

  const t = useCallback((k)=>{
    const d = DICT[lang]||DICT.it;
    return d[k]!==undefined ? d[k] : (DICT.it[k]!==undefined?DICT.it[k]:k);
  },[lang]);
  const arr = useCallback((k)=>{
    const d = DICT[lang]||DICT.it;
    return d[k]!==undefined ? d[k] : (DICT.it[k]||[]);
  },[lang]);

  const go = useCallback((r)=>{ window.location.hash = "#"+r; },[]);

  const addToCart = useCallback((item)=>{
    setCart(prev=>{
      const found = prev.find(x=>x.id===item.id);
      if(found) return prev.map(x=> x.id===item.id ? {...x,qty:x.qty+1} : x);
      return [...prev,{...item,qty:1}];
    });
    setCartOpen(true);
  },[]);
  const removeFromCart = useCallback((id)=>setCart(p=>p.filter(x=>x.id!==id)),[]);
  const setQty = useCallback((id,q)=>setCart(p=>p.map(x=>x.id===id?{...x,qty:Math.max(1,q)}:x)),[]);
  const clearCart = useCallback(()=>setCart([]),[]);

  const cartCount = cart.reduce((s,x)=>s+x.qty,0);
  const cartTotal = cart.reduce((s,x)=>s+x.qty*(x.transfer?x.cost:x.price),0);

  const ctx = {lang,setLang,t,arr,go,route,cart,addToCart,removeFromCart,setQty,clearCart,cartCount,cartTotal,cartOpen,setCartOpen,menuOpen,setMenuOpen,session,setSession};

  const needsGate = route!=="/gate" && route!=="/boot" && !session;

  let page;
  if(route==="/boot") page=<Boot/>;
  else if(needsGate) page=<Gate/>;
  else {
    switch(route){
      case "/gate": page=<Gate/>; break;
      case "/node": page=<Home/>; break;
      case "/cash": page=<Cash/>; break;
      case "/paypal": page=<Paypal/>; break;
      case "/quality": page=<Quality/>; break;
      case "/feedback": page=<Feedback/>; break;
      case "/faq": page=<Faq/>; break;
      case "/track": page=<Track/>; break;
      case "/privacy": page=<Legal which="privacy"/>; break;
      case "/terms": page=<Legal which="terms"/>; break;
      case "/cookies": page=<Legal which="cookies"/>; break;
      case "/checkout": page=<Checkout/>; break;
      default: page=<Home/>;
    }
  }

  const shell = route!=="/boot";

  return (
    <Ctx.Provider value={ctx}>
      <div className="blob blob-a"></div>
      <div className="blob blob-b"></div>
      <div className="blob blob-c"></div>
      <div className="bgfx"></div>
      <div className="relative" style={{zIndex:2,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
        {shell && <Header/>}
        <main className="flex-1">
          <div key={route} className="fade-up">{page}</div>
        </main>
        {shell && <Footer/>}
      </div>
      <CartDrawer/>
      <FAB/>
    </Ctx.Provider>
  );
}

/* ============================================================
   BOOT
   ============================================================ */
function Boot(){
  const {arr,go,session} = useApp();
  const lines = arr("boot.lines");
  const [shown,setShown] = useState(0);
  const [pct,setPct] = useState(0);

  useEffect(()=>{
    const iv = setInterval(()=>{
      setShown(s=>{
        if(s>=lines.length){ clearInterval(iv); return s; }
        return s+1;
      });
    },380);
    const pv = setInterval(()=> setPct(p=>Math.min(100,p+4)),90);
    const done = setTimeout(()=>{ go(session?"/node":"/gate"); },3400);
    return ()=>{clearInterval(iv);clearInterval(pv);clearTimeout(done);};
  },[lines.length]);

  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="w-full max-w-xl">
        <div className="card p-8">
          <div className="flex items-center gap-3 mb-6">
            <span style={{width:10,height:10,borderRadius:99,background:"var(--tl)"}} className="pulse-dot"></span>
            <span className="eyebrow">GUSTAVOEURO · BOOT SEQUENCE</span>
          </div>
          <div className="mono text-[12.5px] leading-7" style={{color:"rgba(238,240,248,.72)"}}>
            {lines.slice(0,shown).map((l,i)=>(
              <div key={i} className="flex gap-2">
                <span style={{color:"var(--au)"}}>[ok]</span><span>{l}</span>
              </div>
            ))}
            {shown<lines.length && <span style={{color:"var(--au)"}} className="pulse-dot">_</span>}
          </div>
          <div className="bar mt-6"><i style={{transform:`scaleX(${pct/100})`,animation:"none",transformOrigin:"left",transition:"transform .1s linear"}}></i></div>
          <div className="mono text-[11px] mt-3" style={{color:"rgba(238,240,248,.5)"}}>{pct}% — {DICT.it["boot.ready"]}</div>
        </div>
      </div>
    </div>
  );
}

  const {t} = useApp();
  const [code,setCode] = useState("");

  const [searched,setSearched] = useState(false);

  const search = ()=>{
    const orders = JSON.parse(localStorage.getItem("ge-orders")||"[]");
    const o = orders.find(x=>x.code.toUpperCase()===code.trim().toUpperCase());
    setFound(o||null); setSearched(true);
  };

  return (
    <div className="max-w-3xl mx-auto px-4 sm:px-6 py-14">
      <div className="eyebrow mb-3">{t("track.kicker")}</div>

        <div className="flex gap-2">
          <input value={code} onChange={e=>setCode(e.target.value)} placeholder="GST-1500-250-7K3F" />
          <button className="btn-gold" onClick={search}>{t("track.btn")}</button>
        </div>
      </div>

      {searched && !found && <div className="mono text-[12px] mt-6" style={{color:"var(--rs)"}}>{t("track.nf")}</div>}

      {found && (
        <div className="card p-6 mt-6">
          <div className="mono text-[11px] mb-2" style={{color:"rgba(238,240,248,.45)"}}>{t("co.order")}</div>
          <div className="mono font-bold text-[15px] mb-4" style={{color:"var(--au)"}}>{found.code}</div>
          <div className="mono text-[11px] mb-1" style={{color:"rgba(238,240,248,.45)"}}>{t("track.status")}</div>
          <div className="mono text-[13px] mb-4" style={{color:"var(--tl)"}}>{found.status}</div>
          <div className="mono text-[11px] mb-2" style={{color:"rgba(238,240,248,.45)"}}>{t("track.items")}</div>
          {found.items.map((it,i)=>(
            <div key={i} className="mono text-[12px]" style={{color:"rgba(238,240,248,.65)"}}>{it.qty}× {it.name}</div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   CHECKOUT
   ============================================================ */
function Checkout(){
  const {t,cart,cartTotal,clearCart,go} = useApp();
  const [step,setStep] = useState(0);
  const [form,setForm] = useState({name:"",addr:"",city:"",zip:"",country:"",phone:"",prefix:"+39",carrier:CARRIERS[0],note:"",email:"",email2:""});
  const [method,setMethod] = useState("crypto");
  const [net,setNet] = useState("USDT");
  const [amazon,setAmazon] = useState("");
  const [order,setOrder] = useState(null);
  const [countdown,setCountdown] = useState(30*60);

  const onlyTransfers = cart.length>0 && cart.every(x=>x.transfer);
  const hasTransfers = cart.some(x=>x.transfer);

  useEffect(()=>{
    if(step!==2) return;
    const iv = setInterval(()=>setCountdown(c=>Math.max(0,c-1)),1000);
    return ()=>clearInterval(iv);
  },[step]);

  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email);
  const emailMatch = form.email && form.email===form.email2;

  const buildCode = ()=>{
    const tags = cart.map(i=> i.transfer ? i.recv : i.price).join("-");
    return "GST-"+tags+"-"+rnd4();
  };

  const totalWithFee = method==="sepa" ? Math.round(cartTotal*1.1) : method==="amazon" ? Math.round(cartTotal*1.2) : cartTotal;

  const confirm = ()=>{
    const code = buildCode();
    const items = cart.map(i=>({name:i.name,qty:i.qty}));
    const rec = {code,status:"IN ATTESA DI PAGAMENTO",items,method,total:totalWithFee,email:form.email,created:Date.now()};
    const all = JSON.parse(localStorage.getItem("ge-orders")||"[]");
    all.push(rec);
    localStorage.setItem("ge-orders",JSON.stringify(all));
    setOrder(rec);
    setStep(3);
    clearCart();
  };

  const mm = String(Math.floor(countdown/60)).padStart(2,"0");
  const ss = String(countdown%60).padStart(2,"0");

  if(!cart.length && step<3){
    return (
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-20 text-center">
        <div className="mono text-[12px] mb-6" style={{color:"rgba(238,240,248,.5)"}}>{t("co.empty")}</div>
        <button className="btn-gold" onClick={()=>go("/cash")}>{t("home.cta1")}</button>
      </div>
    );
  }

  const steps = [t("co.step1"),t("co.step2"),t("co.step3"),t("co.step4")];

  return (
    <div className="max-w-4xl mx-auto px-4 sm:px-6 py-14">
      <div className="flex gap-2 mb-10 flex-wrap">
        {steps.map((s,i)=>(
          <span key={i} className="chip" style={step>=i?{borderColor:"var(--au)",color:"var(--au)"}:{}}>
            {i+1}. {s}
          </span>
        ))}
      </div>

      {/* STEP 0 — DATI */}
      {step===0 && (
        <div className="card p-6">
          {onlyTransfers && (
            <div className="mb-6">
              <label>{t("co.email")}</label>
              <input value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@paypal.com" />
              {form.email && !emailOk && <div className="mono text-[11px] mt-2" style={{color:"var(--rs)"}}>{t("co.emailErr")}</div>}
              <label className="mt-4">{t("co.email2")}</label>
              <input value={form.email2} onChange={e=>setForm({...form,email2:e.target.value})} placeholder="you@paypal.com" />
              {form.email2 && !emailMatch && <div className="mono text-[11px] mt-2" style={{color:"var(--rs)"}}>{t("co.mismatch")}</div>}
            </div>
          )}

          {!onlyTransfers && (
            <div className="grid sm:grid-cols-2 gap-4">
              <div className="sm:col-span-2"><label>Nome</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div>
              <div className="sm:col-span-2"><label>Indirizzo</label><input value={form.addr} onChange={e=>setForm({...form,addr:e.target.value})}/></div>
              <div><label>Città</label><input value={form.city} onChange={e=>setForm({...form,city:e.target.value})}/></div>
              <div><label>CAP</label><input value={form.zip} onChange={e=>setForm({...form,zip:e.target.value})}/></div>
              <div><label>Paese</label><input value={form.country} onChange={e=>setForm({...form,country:e.target.value})}/></div>
              <div>
                <label>Telefono</label>
                <div className="flex gap-2">
                  <select value={form.prefix} onChange={e=>setForm({...form,prefix:e.target.value})} className="w-24">
                    {PREFIXES.map(p=><option key={p}>{p}</option>)}
                  </select>
                  <input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/>
                </div>
              </div>
              <div className="sm:col-span-2">
                <label>Corriere</label>
                <select value={form.carrier} onChange={e=>setForm({...form,carrier:e.target.value})}>
                  {CARRIERS.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="sm:col-span-2"><label>Note</label><input value={form.note} onChange={e=>setForm({...form,note:e.target.value})}/></div>
              {hasTransfers && (
                <>
                  <div className="sm:col-span-2"><label>{t("co.email")}</label><input value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></div>
                  <div className="sm:col-span-2"><label>{t("co.email2")}</label><input value={form.email2} onChange={e=>setForm({...form,email2:e.target.value})}/></div>
                </>
              )}
            </div>
          )}
        </div>
      )}

      {/* STEP 1 — VERIFICA */}
      {step===1 && (
        <div className="card p-6">
          <div className="eyebrow mb-4">{t("co.summary")}</div>
          {cart.map(i=>(
            <div key={i.id} className="flex justify-between mono text-[12.5px] py-2" style={{borderBottom:"1px solid var(--line)"}}>
              <span>{i.qty}× {i.name}</span>
              <span style={{color:"var(--au)"}}>{money(i.qty*(i.transfer?i.cost:i.price))}</span>
            </div>
          ))}
          <div className="flex justify-between mt-4">
            <span className="mono text-[12px]">{t("common.total")}</span>
            <span className="mono font-bold" style={{color:"var(--au)"}}>{money(cartTotal)}</span>
          </div>
        </div>
      )}

      {/* STEP 2 — PAGAMENTO */}
      {step===2 && (
        <div className="card p-6">
          <div className="eyebrow mb-4">{t("co.payTitle")}</div>
          <div className="space-y-2 mb-6">
            {[["crypto","co.crypto"],["sepa","co.sepa"],["amazon","co.amazon"]].map(([k,kk])=>(
              <button key={k} onClick={()=>setMethod(k)} className="card p-4 w-full text-left"
                style={method===k?{borderColor:"var(--au)"}:{}}>
                <span className="text-[13px]" style={{color:"rgba(238,240,248,.75)"}}>{t(kk)}</span>
              </button>
            ))}
          </div>

          {method==="crypto" && (
            <div className="card p-5">
              <div className="flex gap-2 mb-5">
                {Object.keys(WALLETS).map(k=>(
                  <button key={k} className="btn-ghost text-[12px]" style={net===k?{borderColor:"var(--au)",color:"var(--au)"}:{}}
                    onClick={()=>setNet(k)}>{WALLETS[k].label}</button>
                ))}
              </div>
              <div className="grid sm:grid-cols-2 gap-5 items-start">
                <div>
                  <label>{t("co.address")}</label>
                  <div className="mono text-[11.5px] break-all mb-4" style={{color:"rgba(238,240,248,.7)"}}>{WALLETS[net].addr}</div>
                  <label>{t("co.amount")}</label>
                  <div className="mono text-xl font-bold" style={{color:"var(--au)"}}>{money(cartTotal)}</div>
                  <div className="mono text-[11px] mt-3" style={{color:"rgba(238,240,248,.5)"}}>
                    {t("co.countdown")}: <span style={{color:"var(--rs)"}}>{mm}:{ss}</span>
                  </div>
                </div>
                <div className="flex justify-center">
                  <img src={QR(WALLETS[net].addr)} alt="QR" style={{width:200,height:200,borderRadius:12,border:"1px solid var(--line)"}}/>
                </div>
              </div>
            </div>
          )}

          {method==="sepa" && (
            <div className="card p-5 mono text-[12.5px]" style={{color:"rgba(238,240,248,.68)"}}>
              {t("co.iban")} — <span style={{color:"var(--au)"}}>{money(totalWithFee)}</span>
            </div>
          )}

          {method==="amazon" && (
            <div className="card p-5">
              <label>{t("co.amazonPh")}</label>
              <input value={amazon} maxLength={15} onChange={e=>setAmazon(e.target.value.replace(/\D/g,""))} placeholder="000000000000000"/>
              <div className="mono text-[11px] mt-3" style={{color:"rgba(238,240,248,.5)"}}>{money(totalWithFee)}</div>
            </div>
          )}
        </div>
      )}

      {/* STEP 3 — CONFERMA */}
      {step===3 && order && (
        <div className="space-y-5">
          <div className="card p-6">
            <div className="eyebrow mb-2" style={{color:"var(--tl)"}}>{t("co.done")}</div>
            <div className="mono text-[11px] mb-2" style={{color:"rgba(238,240,248,.5)"}}>{t("co.order")}</div>
            <div className="mono text-2xl font-bold" style={{color:"var(--au)"}}>{order.code}</div>
            <button className="btn-ghost mt-4 text-[12px]"
              onClick={()=>navigator.clipboard && navigator.clipboard.writeText(order.code)}>{t("co.copy")}</button>
          </div>

          <div className="card p-6" style={{borderColor:"rgba(255,92,92,.4)",background:"rgba(255,92,92,.05)"}}>
            <div className="mono font-bold text-[13px] mb-2" style={{color:"var(--rs)"}}>{t("co.red.title")}</div>
            <p className="text-[13px] mb-4" style={{color:"rgba(238,240,248,.68)"}}>{t("co.red.text")}</p>
            <a href={TG} target="_blank" rel="noopener noreferrer" className="btn-gold">{t("cash.tgBtn")}</a>
          </div>

          <button className="btn-ghost" onClick={()=>go("/track")}>{t("nav.track")}</button>
        </div>
      )}

      {/* NAV */}
      {step<3 && (
        <div className="flex justify-between mt-8">
          <button className="btn-ghost" disabled={step===0} onClick={()=>setStep(s=>Math.max(0,s-1))}>{t("co.back")}</button>
          {step<2
            ? <button className="btn-gold" disabled={step===0 && onlyTransfers && !(emailOk&&emailMatch)} onClick={()=>setStep(s=>s+1)}>{t("co.next")}</button>
            : <button className="btn-gold" onClick={confirm}>{t("co.done")}</button>}
        </div>
      )}
    </div>
  );
}
